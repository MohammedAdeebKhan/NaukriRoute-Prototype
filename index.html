<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NaukriRoute — From Skills to Opportunities</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-leaf">●</span><span> NaukriRoute</span></div>
    <nav id="nav">
      <button data-page="home" class="active">⌂ <span>Home</span></button>
      <button data-page="path">◎ <span>My Path</span></button>
      <button data-page="learn">▣ <span>Learn</span></button>
      <button data-page="opportunities">▣ <span>Opportunities</span></button>
      <button data-page="community">♧ <span>Community</span></button>
      <button data-page="profile">♙ <span>Profile</span></button>
    </nav>
    <div class="calendar">
      <b>Roadmap Calendar</b>
      <div class="month">‹ &nbsp; Sep 2026 &nbsp; ›</div>
      <div class="days">S M T W T F S</div>
      <div class="dates">1&nbsp;&nbsp;2&nbsp;&nbsp;3&nbsp;&nbsp;4&nbsp;&nbsp;5<br>
        6&nbsp;&nbsp;7&nbsp;&nbsp;8&nbsp;&nbsp;9&nbsp;10&nbsp;11&nbsp;12<br>
        13&nbsp;14&nbsp;15&nbsp;16&nbsp;17&nbsp;18&nbsp;19<br>
        20&nbsp;21&nbsp;22&nbsp;23&nbsp;<b>24</b>&nbsp;25&nbsp;26<br>
        27&nbsp;28&nbsp;29&nbsp;30
      </div>
    </div>
    <div class="track"><span>▥</span><div><b>You're on track</b><br><small>Keep going to reach your next milestone.</small></div></div>
  </aside>

  <main class="main">
    <header>
      <div class="search">⌕ &nbsp; Search careers, skills or courses...</div>
      <div class="header-actions">♧ <span class="avatar">A</span></div>
    </header>
    <section id="content"></section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
